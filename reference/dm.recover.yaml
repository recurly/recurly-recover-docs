openapi: 3.0.0
info:
  title: Recurly Recover API
  description: >-
    # Recurly Recover API


    This API exposes the Recurly Revenue Recovery endpoints for partners.


    Use it to submit failed payments to Recurly for recovery, report payment
    results, and track the related accounts, invoices, transactions, and dunning
    campaigns.


    ## Capabilities


    - **Create an invoice for revenue recovery** — Submit a failed payment to
    Recurly for retry. Send the account, billing information, line items, and
    details of the failed transaction. Recurly creates the invoice and manages
    collection.

    - **Mark an invoice as successful or failed** — Report the outcome of a
    payment handled outside Recurly. A successful mark stops collection and
    records the revenue. A failed mark halts dunning.

    - **List and fetch accounts, invoices, and transactions** — Track recovery
    activity in Recurly.

    - **List and fetch dunning campaigns** — Review the settings that control
    retries and dunning emails.

    - **Redact an account** — Permanently erase personal data (GDPR right to
    erasure).


    ## Authentication


    Authenticate with HTTP Basic auth. Use your API key as the username. Leave
    the password empty.


    ## Versioning


    Every request must send the API version in the `Accept` header:


    ```

    Accept: application/vnd.recurly.v2021-02-25

    ```


    The `+json` media type is also accepted:
    `application/vnd.recurly.v2021-02-25+json`. Requests without a versioned
    `Accept` header return a `406 Not Acceptable` response.


    Every response includes a `Recurly-Version` header with the version that
    processed the request:


    ```

    Recurly-Version: recurly.v2021-02-25

    ```


    ## Pagination


    List endpoints return results in pages. See the [Pagination
    Guide](/developers/guides/pagination.html).
  version: '2021-02-25'
servers:
  - url: https://v3.recurly.com
  - url: https://v3.eu.recurly.com
security:
  - api_key: []
tags:
  - name: Account
    description: >-
      Accounts are core to managing your customers inside of Recurly. The
      account object stores the entire Recurly history of your customer and acts
      as the entry point for working with a customer's billing information,
      subscription data, transactions, invoices and more.
  - name: Invoice
    description: >-
      An invoice relates charges, credits, and payments together. When a
      subscription is created or renewed or a charge is created on the account,
      Recurly will sum the charges, discount or tax as appropriate, and send the
      invoice out for collection.
  - name: Transaction
    description: >-
      Purchasing information is sent to your payment gateway in an action called
      a transaction. This includes the customer's billing information and the
      amount of money to be charged, voided, or refunded.
  - name: Revenue Recovery
    description: Revenue recovery
  - name: Dunning Campaigns
    description: >-
      Settings used when attempting to dun customers whose payments are
      declined.
paths:
  /accounts:
    get:
      tags:
        - Account
      operationId: list_accounts
      x-product:
        - recover
      summary: List a site's accounts
      description: >-
        See the [Pagination Guide](/developers/guides/pagination.html) to learn
        how to use pagination in the API and Client Libraries.
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/sort_dates'
        - $ref: '#/components/parameters/filter_begin_time'
        - $ref: '#/components/parameters/filter_end_time'
        - $ref: '#/components/parameters/filter_account_email'
        - $ref: '#/components/parameters/filter_account_subscriber'
        - $ref: '#/components/parameters/filter_account_past_due'
      responses:
        '200':
          description: A list of the site's accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '400':
          description: Invalid or unpermitted parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Incorrect site ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{account_id}:
    parameters:
      - $ref: '#/components/parameters/account_id'
    get:
      tags:
        - Account
      operationId: get_account
      x-product:
        - recover
      summary: Fetch an account
      parameters:
        - $ref: '#/components/parameters/accept_header'
      responses:
        '200':
          description: An account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{account_id}/redact:
    parameters:
      - $ref: '#/components/parameters/account_id'
    put:
      tags:
        - Account
      operationId: redact_account
      x-product:
        - recover
      summary: Redact an account (GDPR Right to Erasure)
      description: >-
        Permanently and irreversibly removes all personally identifiable
        information (PII) from an account to fulfill a data subject's right to
        erasure under GDPR and similar privacy regulations (e.g. CCPA). This
        includes billing information, shipping addresses, and transaction
        details such as names, email addresses, and payment card data. The
        underlying account and transaction records are retained for financial
        and audit purposes, but all personal data fields are cleared. The
        account must have no active subscriptions, uninvoiced charges, or
        partially paid invoices before it can be redacted. Redaction is
        processed asynchronously and cannot be undone.
      parameters:
        - $ref: '#/components/parameters/accept_header'
      responses:
        '200':
          description: >-
            Account has been accepted for redaction and will be processed
            asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '422':
          description: >-
            Account cannot be redacted. Common reasons include active
            subscriptions, uninvoiced charges, or partially paid invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{account_id}/invoices:
    get:
      tags:
        - Invoice
      operationId: list_account_invoices
      x-product:
        - recover
      summary: List an account's invoices
      description: >-
        See the [Pagination Guide](/developers/guides/pagination.html) to learn
        how to use pagination in the API and Client Libraries.
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/account_id'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/invoice_state'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/sort_dates'
        - $ref: '#/components/parameters/filter_begin_time'
        - $ref: '#/components/parameters/filter_end_time'
        - $ref: '#/components/parameters/filter_invoice_type'
      responses:
        '200':
          description: A list of the account's invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        '400':
          description: Invalid or unpermitted parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Incorrect site or account ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{account_id}/transactions:
    get:
      tags:
        - Transaction
      operationId: list_account_transactions
      x-product:
        - recover
      summary: List an account's transactions
      description: >-
        See the [Pagination Guide](/developers/guides/pagination.html) to learn
        how to use pagination in the API and Client Libraries.
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/account_id'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/sort_dates'
        - $ref: '#/components/parameters/filter_begin_time'
        - $ref: '#/components/parameters/filter_end_time'
        - $ref: '#/components/parameters/filter_transaction_type'
        - $ref: '#/components/parameters/filter_transaction_success'
      responses:
        '200':
          description: A list of the account's transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        '400':
          description: Invalid or unpermitted parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Incorrect site or subscription ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invoices:
    get:
      tags:
        - Invoice
      operationId: list_invoices
      x-product:
        - recover
      summary: List a site's invoices
      description: >-
        See the [Pagination Guide](/developers/guides/pagination.html) to learn
        how to use pagination in the API and Client Libraries.
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/invoice_state'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/sort_dates'
        - $ref: '#/components/parameters/filter_begin_time'
        - $ref: '#/components/parameters/filter_end_time'
        - $ref: '#/components/parameters/filter_invoice_type'
      responses:
        '200':
          description: A list of the site's invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        '400':
          description: Invalid or unpermitted parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Incorrect site ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invoices/{invoice_id}:
    get:
      tags:
        - Invoice
      operationId: get_invoice
      x-product:
        - recover
      summary: Fetch an invoice
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/invoice_id'
      responses:
        '200':
          description: An invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Incorrect site or invoice ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invoices/{invoice_id}/mark_failed:
    put:
      tags:
        - Invoice
      operationId: mark_invoice_failed
      x-product:
        - recover
      summary: Mark an open invoice as failed
      description: >
        Indicates that the invoice was not successfully paid for and that
        collection attempts should stop. This functionality is mostly used to
        halt the dunning procedures for an invoice.


        Only invoices with the `pending`, `processing` or `past_due` states can
        be marked as failed.
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/invoice_id'
      responses:
        '200':
          description: The updated invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Incorrect site or invoice ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Tried marking a closed (successful or failed) invoice as failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invoices/{invoice_id}/mark_successful:
    put:
      tags:
        - Invoice
      operationId: mark_invoice_successful
      x-product:
        - recover
      summary: Mark an open invoice as successful
      description: >
        Indicates that the invoice was successfully paid for and that automated
        collection attempts should stop - this functionality is typically used
        to indicate that payment was received via another method and that
        revenue should be recognized.


        Only invoices with the `pending`, `processing`, `past_due` or `failed`
        states can be marked as paid.
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/invoice_id'
      responses:
        '200':
          description: The updated invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Incorrect site or invoice ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Tried marking a closed (successful or failed) invoice as successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invoices/recovery:
    post:
      tags:
        - Revenue Recovery
      operationId: create_invoice_retry
      x-product:
        - recover
      summary: Create an invoice for revenue recovery
      parameters:
        - $ref: '#/components/parameters/accept_header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryInvoiceCreate'
        required: true
      responses:
        '201':
          description: Returns the new invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCollection'
        '400':
          description: Bad request, perhaps invalid JSON?
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Incorrect site ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Invalid parameters, no pending line items, or error running the
            transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMayHaveTransaction'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /transactions:
    get:
      tags:
        - Transaction
      operationId: list_transactions
      x-product:
        - recover
      summary: List a site's transactions
      description: >-
        See the [Pagination Guide](/developers/guides/pagination.html) to learn
        how to use pagination in the API and Client Libraries.
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/sort_dates'
        - $ref: '#/components/parameters/filter_begin_time'
        - $ref: '#/components/parameters/filter_end_time'
        - $ref: '#/components/parameters/filter_transaction_type'
        - $ref: '#/components/parameters/filter_transaction_success'
      responses:
        '200':
          description: A list of the site's transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        '400':
          description: Invalid or unpermitted parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Incorrect site or subscription ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /transactions/{transaction_id}:
    get:
      tags:
        - Transaction
      operationId: get_transaction
      x-product:
        - recover
      summary: Fetch a transaction
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: A transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Incorrect site or transaction ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /dunning_campaigns:
    get:
      tags:
        - Dunning Campaigns
      operationId: list_dunning_campaigns
      x-product:
        - recover
      summary: List the dunning campaigns for a site
      description: >-
        See the [Pagination Guide](/developers/guides/pagination.html) to learn
        how to use pagination in the API and Client Libraries.
      parameters:
        - $ref: '#/components/parameters/accept_header'
        - $ref: '#/components/parameters/sort_dates'
      responses:
        '200':
          description: A list of the the dunning_campaigns on an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningCampaignList'
        '404':
          description: Incorrect site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /dunning_campaigns/{dunning_campaign_id}:
    parameters:
      - $ref: '#/components/parameters/dunning_campaign_id'
    get:
      tags:
        - Dunning Campaigns
      operationId: get_dunning_campaign
      x-product:
        - recover
      summary: Fetch a dunning campaign
      parameters:
        - $ref: '#/components/parameters/accept_header'
      responses:
        '200':
          description: Settings for a dunning campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningCampaign'
        '400':
          description: Bad request; perhaps missing or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Incorrect site or campaign ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    accept_header:
      name: Accept
      in: header
      description: >-
        The API version to use for this request, e.g.
        `application/vnd.recurly.v2021-02-25`. Requests without a versioned
        `Accept` header return a 406 response.
      required: true
      schema:
        default: application/vnd.recurly.v2021-02-25
        $ref: '#/components/schemas/AcceptHeaderEnum'
    account_id:
      name: account_id
      in: path
      description: >-
        Account ID or code. For ID no prefix is used e.g. `e28zov4fw0v2`. For
        code use prefix `code-`, e.g. `code-bob`.
      required: true
      schema:
        type: string
    invoice_id:
      name: invoice_id
      in: path
      description: >-
        Invoice ID or number. For ID no prefix is used e.g. `e28zov4fw0v2`. For
        number use prefix `number-`, e.g. `number-1000`. For number with prefix
        or country code, use `number-` and `prefix`, e.g. `number-TEST-FR1001`
      required: true
      schema:
        type: string
    invoice_state:
      name: state
      in: query
      description: Invoice state.
      schema:
        $ref: '#/components/schemas/InvoiceStateQueryParamEnum'
    transaction_id:
      name: transaction_id
      in: path
      description: >-
        Transaction ID or UUID. For ID no prefix is used e.g. `e28zov4fw0v2`.
        For UUID use prefix `uuid-`, e.g. `uuid-123457890`.
      required: true
      schema:
        type: string
    dunning_campaign_id:
      name: dunning_campaign_id
      in: path
      description: Dunning Campaign ID, e.g. `e28zov4fw0v2`.
      required: true
      schema:
        type: string
    ids:
      name: ids
      in: query
      description: >
        Filter results by their IDs. Up to 200 IDs can be passed at once using

        commas as separators, e.g. `ids=h1at4d57xlmy,gyqgg0d3v9n1,jrsm5b4yefg6`.


        **Important notes:**


        * The `ids` parameter cannot be used with any other ordering or
        filtering
          parameters (`limit`, `order`, `sort`, `begin_time`, `end_time`, etc)
        * Invalid or unknown IDs will be ignored, so you should check that the
          results correspond to your request.
        * Records are returned in an arbitrary order. Since results are all
          returned at once you can sort the records yourself.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    limit:
      name: limit
      in: query
      description: Limit number of records 1-200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    order:
      name: order
      in: query
      description: Sort order.
      schema:
        default: desc
        $ref: '#/components/schemas/AlphanumericSortEnum'
    sort_dates:
      name: sort
      in: query
      description: >
        Sort field. You *really* only want to sort by `updated_at` in ascending

        order. In descending order updated records will move behind the cursor
        and could

        prevent some records from being returned.
      schema:
        default: created_at
        $ref: '#/components/schemas/TimestampSortEnum'
    filter_begin_time:
      name: begin_time
      in: query
      description: >
        Inclusively filter by begin_time when `sort=created_at` or
        `sort=updated_at`.

        **Note:** this value is an ISO8601 timestamp. A partial timestamp that
        does not include a time zone will default to UTC.
      schema:
        type: string
        format: date-time
    filter_end_time:
      name: end_time
      in: query
      description: >
        Inclusively filter by end_time when `sort=created_at` or
        `sort=updated_at`.

        **Note:** this value is an ISO8601 timestamp. A partial timestamp that
        does not include a time zone will default to UTC.
      schema:
        type: string
        format: date-time
    filter_account_email:
      name: email
      in: query
      description: >-
        Filter for accounts with this exact email address. A blank value will
        return accounts with both `null` and `""` email addresses. Note that
        multiple accounts can share one email address.
      schema:
        type: string
    filter_account_subscriber:
      name: subscriber
      in: query
      description: |
        Filter for accounts with or without a subscription in the `active`,
        `canceled`, or `future` state.
      schema:
        type: boolean
    filter_account_past_due:
      name: past_due
      in: query
      description: Filter for accounts with an invoice in the `past_due` state.
      schema:
        $ref: '#/components/schemas/TrueEnum'
    filter_transaction_type:
      name: type
      in: query
      description: >-
        Filter by type field. The value `payment` will return both `purchase`
        and `capture` transactions.
      schema:
        $ref: '#/components/schemas/FilterTransactionTypeEnum'
    filter_transaction_success:
      name: success
      in: query
      description: Filter by success field.
      schema:
        $ref: '#/components/schemas/TrueEnum'
    filter_invoice_type:
      name: type
      in: query
      description: |
        Filter by type when:
        - `type=charge`, only charge invoices will be returned.
        - `type=credit`, only credit invoices will be returned.
        - `type=non-legacy`, only charge and credit invoices will be returned.
        - `type=legacy`, only legacy invoices will be returned.
      schema:
        $ref: '#/components/schemas/FilterInvoiceTypeEnum'
  securitySchemes:
    api_key:
      type: http
      description: >-
        Enter the API key as the username and set the password to an empty
        string. You can locate and manage your API keys from the [API
        Credentials](https://app.recurly.com/go/developer/api_keys) page.
      scheme: basic
  schemas:
    AcceptHeaderEnum:
      type: string
      enum:
        - application/vnd.recurly.v2021-02-25
        - application/vnd.recurly.v2021-02-25+json
    AccountList:
      type: object
      properties:
        object:
          type: string
          title: Object type
          description: Will always be List.
