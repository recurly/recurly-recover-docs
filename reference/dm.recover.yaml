        dunning_cycles:
          type: array
          description: Dunning Cycle settings.
          items:
            $ref: '#/components/schemas/DunningCycle'
        created_at:
          type: string
          format: date-time
          description: When the current campaign was created in Recurly.
        updated_at:
          type: string
          format: date-time
          description: When the current campaign was updated in Recurly.
        deleted_at:
          type: string
          format: date-time
          description: When the current campaign was deleted in Recurly.
    DunningCampaignList:
      type: object
      properties:
        object:
          type: string
          title: Object type
          description: Will always be List.
        has_more:
          type: boolean
          description: Indicates there are more results on subsequent pages.
        next:
          type: string
          description: Path to subsequent page of results.
        data:
          type: array
          items:
            $ref: '#/components/schemas/DunningCampaign'
    DunningCycle:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/DunningCycleTypeEnum'
        applies_to_manual_trial:
          type: boolean
          description: >-
            Whether the dunning settings will be applied to manual trials. Only
            applies to trial cycles.
        first_communication_interval:
          type: integer
          description: >-
            The number of days after a transaction failure before the first
            dunning email is sent.
        send_immediately_on_hard_decline:
          type: boolean
          description: >-
            Whether or not to send an extra email immediately to customers whose
            initial payment attempt fails with either a hard decline or invalid
            billing info.
        intervals:
          type: array
          description: Dunning intervals.
          items:
            $ref: '#/components/schemas/DunningInterval'
        expire_subscription:
          type: boolean
          description: >-
            Whether the subscription(s) should be cancelled at the end of the
            dunning cycle.
        fail_invoice:
          type: boolean
          description: >-
            Whether the invoice should be failed at the end of the dunning
            cycle.
        total_dunning_days:
          type: integer
          description: >-
            The number of days between the first dunning email being sent and
            the end of the dunning cycle.
        total_recycling_days:
          type: integer
          description: >-
            The number of days between a transaction failure and the end of the
            dunning cycle.
        version:
          type: integer
          description: Current campaign version.
        created_at:
          type: string
          format: date-time
          description: When the current settings were created in Recurly.
        updated_at:
          type: string
          format: date-time
          description: When the current settings were updated in Recurly.
    DunningInterval:
      type: object
      properties:
        days:
          type: integer
          description: Number of days before sending the next email.
        email_template:
          type: string
          description: Email template being used.
        email_template_id:
          type: string
          nullable: true
          description: >-
            The id of the custom email template assigned to this interval, from
            `GET /dunning_campaigns/email_templates`. `null` means the system
            default template for this interval. Accepted on write; round-tripped
            on read.
    ExternalAccount:
      type: object
      title: External Account
      properties:
        object:
          type: string
          default: external_account
        id:
          type: string
          description: UUID of the external_account .
        external_account_code:
          type: string
          description: Represents the account code for the external account.
        external_connection_type:
          type: string
          description: >-
            Represents the connection type. One of the connection types of your
            enabled App Connectors
        created_at:
          type: string
          format: date-time
          description: Created at
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Last updated at
          readOnly: true
    PaymentMethod:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/PaymentMethodEnum'
        card_type:
          description: Visa, MasterCard, American Express, Discover, JCB, etc.
          $ref: '#/components/schemas/CardTypeEnum'
        first_six:
          type: string
          description: >
            Credit card number's first six digits.


            For a tokenized wallet payment (`apple_pay`, `google_pay`, or

            `google_pay_device_pan`), this is the DPAN's (the wallet/device
            token's own

            number) first six digits, not the underlying card's (FPAN).
          maxLength: 6
        last_four:
          type: string
          description: >
            Credit card number's last four digits. Will refer to bank account if
            payment

            method is ACH.


            For a tokenized wallet payment (`apple_pay`, `google_pay`, or

            `google_pay_device_pan`), this is the DPAN's last four digits, not
            the

            underlying card's (FPAN).
          maxLength: 4
        last_two:
          type: string
          description: The IBAN bank account's last two digits.
          maxLength: 2
        exp_month:
          type: integer
          description: Expiration month.
          maxLength: 2
        exp_year:
          type: integer
          description: Expiration year.
          maxLength: 4
        gateway_token:
          type: string
          description: >-
            A token used in place of a credit card in order to perform
            transactions.
          maxLength: 50
        cc_bin_country:
          type: string
          description: >-
            The 2-letter ISO 3166-1 alpha-2 country code associated with the
            card's issuer, if known.
        funding_source:
          $ref: '#/components/schemas/CardFundingSourceEnum'
          description: The funding source of the card, if known.
        gateway_code:
          type: string
          description: An identifier for a specific payment gateway.
          maxLength: 13
        gateway_attributes:
          type: object
          description: Gateway specific attributes associated with this PaymentMethod
          x-class-name: GatewayAttributes
          properties:
            account_reference:
              type: string
              description: >-
                Used by Adyen and Braintree gateways. For Adyen the Shopper
                Reference value used when the external token was created. For
                Braintree the PayPal PayerID is populated in the response.
              maxLength: 264
        card_network_preference:
          description: >-
            Represents the card network preference associated with the billing
            info for dual badged cards. Must be a supported card network.
          $ref: '#/components/schemas/CardNetworkEnum'
        billing_agreement_id:
          type: string
          description: >-
            Billing Agreement identifier. Only present for Amazon or Paypal
            payment methods.
        name_on_account:
          type: string
          description: The name associated with the bank account.
        account_type:
          description: The bank account type. Only present for ACH payment methods.
          $ref: '#/components/schemas/AccountTypeEnum'
        routing_number:
          type: string
          description: >-
            The bank account's routing number. Only present for ACH payment
            methods.
        routing_number_bank:
          type: string
          description: The bank name of this routing number.
        username:
          type: string
          description: >-
            Username of the associated payment method. Currently only associated
            with Venmo.
    Error:
      type: object
      properties:
        type:
          title: Type
          $ref: '#/components/schemas/ErrorTypeEnum'
        message:
          type: string
          title: Message
        params:
          type: array
          title: Parameter specific errors
          items:
            type: object
            properties:
              param:
                type: string
    ErrorMayHaveTransaction:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            transaction_error:
              type: object
              x-class-name: TransactionError
              title: Transaction error details
              description: This is only included on errors with `type=transaction`.
              properties:
                object:
                  type: string
                  title: Object type
                transaction_id:
                  type: string
                  title: Transaction ID
                  maxLength: 13
                category:
                  title: Category
                  $ref: '#/components/schemas/ErrorCategoryEnum'
                code:
                  title: Code
