    Account:
      allOf:
        - $ref: '#/components/schemas/AccountReadOnly'
        - $ref: '#/components/schemas/AccountResponse'
    AccountReadOnly:
      type: object
      properties:
        id:
          type: string
          maxLength: 13
          readOnly: true
        object:
          type: string
          title: Object type
          readOnly: true
        state:
          description: Accounts can be either active or inactive.
          readOnly: true
          $ref: '#/components/schemas/ActiveStateEnum'
        hosted_login_token:
          type: string
          description: >-
            The unique token for automatically logging the account in to the
            hosted management pages. You may automatically log the user into
            their hosted management pages by directing the user to:
            `https://{subdomain}.recurly.com/account/{hosted_login_token}`.
          readOnly: true
          maxLength: 32
        shipping_addresses:
          type: array
          description: The shipping addresses on the account.
          items:
            $ref: '#/components/schemas/ShippingAddress'
        has_live_subscription:
          type: boolean
          description: >-
            Indicates if the account has a subscription that is either active,
            canceled, future, or paused.
        has_active_subscription:
          type: boolean
          description: Indicates if the account has an active subscription.
        has_future_subscription:
          type: boolean
          description: Indicates if the account has a future subscription.
        has_canceled_subscription:
          type: boolean
          description: Indicates if the account has a canceled subscription.
        has_paused_subscription:
          type: boolean
          description: Indicates if the account has a paused subscription.
        has_past_due_invoice:
          type: boolean
          description: Indicates if the account has a past due invoice.
        created_at:
          type: string
          format: date-time
          description: When the account was created.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: When the account was last changed.
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          description: If present, when the account was last marked inactive.
          readOnly: true
    AccountResponse:
      type: object
      properties:
        code:
          type: string
          description: >-
            The unique identifier of the account. This cannot be changed once
            the account is created.
          maxLength: 50
          readOnly: true
        username:
          type: string
          description: A secondary value for the account.
          maxLength: 255
        email:
          type: string
          format: email
          description: >-
            The email address used for communicating with this customer. The
            customer will also use this email address to log into your hosted
            account management pages. This value does not need to be unique.
          maxLength: 255
        override_business_entity_id:
          type: string
          title: Override Business Entity ID
          description: >-
            Unique ID to identify the business entity assigned to the account.
            Available when the `Multiple Business Entities` feature is enabled.
        preferred_locale:
          description: >-
            Used to determine the language and locale of emails sent on behalf
            of the merchant to the customer.
          $ref: '#/components/schemas/PreferredLocaleEnum'
        preferred_time_zone:
          type: string
          example: America/Los_Angeles
          description: >-
            The [IANA time zone
            name](https://docs.recurly.com/docs/email-time-zones-and-time-stamps#supported-api-iana-time-zone-names)
            used to determine the time zone of emails sent on behalf of the
            merchant to the customer.
        cc_emails:
          type: string
          description: >-
            Additional email address that should receive account correspondence.
            These should be separated only by commas. These CC emails will
            receive all emails that the `email` field also receives.
          maxLength: 255
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        company:
          type: string
          maxLength: 50
        vat_number:
          type: string
          description: >-
            The VAT number of the account (to avoid having the VAT applied).
            This is only used for manually collected invoices.
          maxLength: 20
        tax_exempt:
          type: boolean
          description: >-
            The tax status of the account. `true` exempts tax on the account,
            `false` applies tax on the account.
        exemption_certificate:
          type: string
          description: >-
            The tax exemption certificate number for the account. If the
            merchant has an integration for the Vertex tax provider, this
            optional value will be sent in any tax calculation requests for the
            account.
          maxLength: 30
        external_accounts:
          type: array
          description: The external accounts belonging to this account
          items:
            $ref: '#/components/schemas/ExternalAccount'
        parent_account_id:
          type: string
          maxLength: 13
          description: The UUID of the parent account associated with this account.
        bill_to:
          maxLength: 6
          description: >-
            An enumerable describing the billing behavior of the account,
            specifically whether the account is self-paying or will rely on the
            parent account to pay.
          $ref: '#/components/schemas/BillToEnum'
        dunning_campaign_id:
          type: string
          title: Dunning Campaign ID
          description: >-
            Unique ID to identify a dunning campaign. Used to specify if a
            non-default dunning campaign should be assigned to this account. For
            sites without multiple dunning campaigns enabled, the default
            dunning campaign will always be used.
        invoice_template_id:
          type: string
          title: Invoice Template ID
          description: >-
            Unique ID to identify an invoice template. Available when the site
            is on a Pro or Elite plan. Used to specify if a non-default invoice
            template will be used to generate invoices for the account. For
            sites without multiple invoice templates enabled, the default
            template will always be used.
        address:
          $ref: '#/components/schemas/Address'
        billing_info:
          $ref: '#/components/schemas/BillingInfo'
        custom_fields:
          $ref: '#/components/schemas/CustomFields'
        entity_use_code:
          type: string
          description: >-
            The Avalara AvaTax value that can be passed to identify the customer
            type for tax purposes. The range of values can be A - R (more info
            at Avalara). Value is case-sensitive.
        bill_date:
          title: Bill Date
          type: string
          format: date-time
          description: >-
            The preferred billing date for the account. This date will be used
            as the billing date for when activating new subscriptions on the
            account.
    AccountMini:
      type: object
      title: Account mini details
      properties:
        id:
          type: string
          maxLength: 13
