        code:
          type: string
          description: The unique identifier of the account.
          maxLength: 50
        email:
          type: string
          format: email
          description: The email address used for communicating with this customer.
          maxLength: 255
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        company:
          type: string
          maxLength: 255
        parent_account_id:
          type: string
          maxLength: 13
        bill_to:
          type: string
          maxLength: 6
        dunning_campaign_id:
          type: string
          title: Dunning Campaign ID
          description: >-
            Unique ID to identify a dunning campaign. Used to specify if a
            non-default dunning campaign should be assigned to this account. For
            sites without multiple dunning campaigns enabled, the default
            dunning campaign will always be used.
    InvoiceAddress:
      allOf:
        - $ref: '#/components/schemas/Address'
        - $ref: '#/components/schemas/AddressWithName'
      type: object
      properties:
        name_on_account:
          type: string
          title: Name on account
        company:
          type: string
          title: Company
    Address:
      type: object
      properties:
        phone:
          type: string
          title: Phone number
        street1:
          type: string
          title: Street 1
          maxLength: 50
        street2:
          type: string
          title: Street 2
          maxLength: 50
        city:
          type: string
          title: City
        region:
          type: string
          title: State/Province
          description: State or province.
        postal_code:
          type: string
          title: Zip/Postal code
          description: Zip or postal code.
        country:
          type: string
          title: Country
          description: Country, 2-letter ISO 3166-1 alpha-2 code.
        geo_code:
          type: string
          maxLength: 20
          description: >-
            Code that represents a geographic entity (location or object). Only
            returned when Vertex or Avalara for Communications is enabled.
    RecoveryAddress:
      type: object
      properties:
        phone:
          type: string
          title: Phone number
        street1:
          type: string
          title: Street 1
          maxLength: 50
        street2:
          type: string
          title: Street 2
          maxLength: 50
        city:
          type: string
          title: City
        region:
          type: string
          title: State/Province
          description: State or province.
        postal_code:
          type: string
          title: Zip/Postal code
          description: Zip or postal code.
        country:
          type: string
          title: Country
          description: Country, 2-letter ISO 3166-1 alpha-2 code.
    RecoveryInvoiceCreate:
      type: object
      properties:
        currency:
          type: string
          title: Currency
          description: 3-letter ISO 4217 currency code.
          maxLength: 3
        due_at:
          type: string
          format: date-time
          title: Due at
          description: Date invoice was originally due. Must be in the past.
        po_number:
          type: string
          title: Purchase order number
          description: This identifies the PO number associated with the subscription.
          maxLength: 50
        external_recovery_eligible:
          type: boolean
          title: External recovery eligible
          description: >-
            Must be set to `true` to acknowledge that the invoice is eligible
            for external recovery. Requests with `false`, omitted, or
            non-boolean values will be rejected.
        account:
          $ref: '#/components/schemas/RecoveryAccountCreate'
        line_items:
          type: array
          title: Line items
          description: >-
            Line items to include on the invoice. Currency is specified at the
            root level and must not be included in individual line items.
          items:
            $ref: '#/components/schemas/RecoveryLineItemCreate'
        transaction_descriptor_suffix:
          type: string
          title: Transaction Descriptor Suffix
          maxLength: 255
          description: >-
            Optionally overrides the suffix component of the composed
            transaction descriptor. If omitted, the suffix is derived from the
            subscription's plan name or the invoice description, with a Trial
            prefix on Visa trial conversions. Subject to gateway availability
            and payment method support.
      required:
        - currency
        - due_at
        - external_recovery_eligible
        - account
        - line_items
    RecoveryBillingInfoCreate:
      type: object
      title: Recovery billing info
      properties:
        first_name:
          type: string
          title: First name
          maxLength: 50
        last_name:
          type: string
          title: Last name
          maxLength: 50
        company:
          type: string
          title: Company name
          maxLength: 100
        address:
          $ref: '#/components/schemas/RecoveryAddress'
        ip_address:
          type: string
          title: IP address
          description: >-
            *STRONGLY RECOMMENDED* Customer's IP address when updating their
            billing information.
          maxLength: 20
        gateway_code:
          type: string
          title: An identifier for a specific payment gateway.
          maxLength: 12
        primary_payment_method:
          type: boolean
          title: Primary Payment Method
          description: >-
            The `primary_payment_method` field is used to designate the primary
            billing info on the account. An account can have a maximum of 1
            primary. If a user sets a different payment method as a primary,
            then the existing primary will no longer be marked as such.
        backup_payment_method:
          type: boolean
          description: >-
            The `backup_payment_method` field is used to designate a billing
            info as a backup on the account that will be tried if the initial
            billing info used for an invoice is declined. All payment methods,
            including the billing info marked `primary_payment_method` can be
            set as a backup. An account can have a maximum of 1 backup, if a
            user sets a different payment method as a backup, the existing
            backup will no longer be marked as such.
        payment_gateway_references:
          type: array
          description: >-
            Array of Payment Gateway References, each a reference to a
            third-party gateway object of varying types.
          items:
            $ref: '#/components/schemas/PaymentGatewayReferences'
        payment_method:
          $ref: '#/components/schemas/RecoveryPaymentMethodCreate'
          description: >-
            Merchant-supplied fallback payment method metadata. Recurly's own
            gateway-token lookup is authoritative and will override any of these
            fields it can determine itself; these fields are only used to fill
            gaps when that lookup is unavailable.
        network_transaction_id:
          type: string
          title: Network Transaction ID
          description: >
            Network transaction ID from the previous customer-in-session
            subscription signup or billing info storage.


            - 10-15 alphanumeric characters for Mastercard

            - 14-15 alphanumeric for Visa

            - 15 digits for all other brands

            - 16 alphanumeric characters for Cartes Bancaires, which are
            processed as Visa or Mastercard
          maxLength: 16
        transactions:
          type: array
          title: Transactions
          description: >-
            Transactions from previous collection attempts for this payment
            method. Optional, unless this billing_info is the primary payment
            method and the account's dunning campaign skips Recurly's own retry
            attempts entirely -- in that case at least one entry is required.
          items:
            $ref: '#/components/schemas/RecoveryTransactionCreate'
      required:
        - gateway_code
        - payment_gateway_references
    RecoveryPaymentMethodCreate:
      type: object
      title: Recovery payment method
      description: >
        Merchant-supplied fallback for payment method metadata on the revenue
        recovery

        endpoint. Recurly's own gateway-token lookup is authoritative for these
        fields;

        a value supplied here is only used to fill a gap when that lookup is
        restricted

        or fails, and is overwritten if that lookup later succeeds.


        Not accepted on the Purchase endpoint or the standard
        billing_info/billing_infos

        endpoints — Recover only.
      properties:
        object:
          $ref: '#/components/schemas/RecoveryPaymentMethodEnum'
          description: The payment method type.
        card_type:
          description: >-
            The card brand (e.g. `Visa`, `MasterCard`). Present for
            `credit_card`, `apple_pay`, and
            `google_pay`/`google_pay_device_pan`; omitted for
            `paypal_billing_agreement`.
          $ref: '#/components/schemas/CardTypeEnum'
        first_six:
          type: string
          description: >
            For a plain card, the card's own first six digits (BIN).


            For a tokenized wallet payment (`apple_pay`, `google_pay`, or

            `google_pay_device_pan`), this is the DPAN's (the wallet/device
            token's own

            number) first six digits — **not** the underlying card's (FPAN). The
            FPAN is

            never accepted or represented; no separate wallet-specific field is
            provided.
          maxLength: 6
        last_four:
          type: string
          description: >-
            The card's (or, for a tokenized wallet payment, the DPAN's) last
            four digits. See `first_six` for the DPAN-vs-FPAN distinction on
            wallets.
          maxLength: 4
        exp_month:
          type: integer
          description: Expiration month.
          maxLength: 2
        exp_year:
          type: integer
          description: Expiration year.
          maxLength: 4
    RecoveryPaymentMethodEnum:
      type: string
      enum:
        - credit_card
        - apple_pay
        - google_pay
        - google_pay_device_pan
        - paypal_billing_agreement
    RecoveryAccountCreate:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/RecoveryAddress'
        billing_infos:
          type: array
          title: Billing Infos
          description: >-
            If the premium Wallet feature is enabled, more than one payment
            method can be associated with an account, and one can be designated
            as a primary and one as a backup. Without the Wallet feature, only
            one payment method will be accepted.
          items:
            $ref: '#/components/schemas/RecoveryBillingInfoCreate'
        code:
          type: string
          description: >-
            The unique identifier of the account. This cannot be changed once
            the account is created.
          maxLength: 50
        email:
          type: string
          format: email
          description: The email address used for communicating with this customer.
          maxLength: 255
        custom_fields:
          $ref: '#/components/schemas/CustomFields'
        dunning_campaign_id:
          type: string
          title: Dunning Campaign ID
          description: >-
            Unique ID to identify a dunning campaign. Used to specify if a
            non-default dunning campaign should be assigned to this account. For
            sites without multiple dunning campaigns enabled, the default
            dunning campaign will always be used.
      required:
        - code
        - billing_infos
    RecoveryLineItemCreate:
      required:
        - unit_amount
      type: object
      title: Recovery line item
      properties:
        tax:
          type: number
          format: float
          title: Tax
          description: The tax amount for the line item.
        custom_fields:
          $ref: '#/components/schemas/CustomFields'
        harmonized_system_code:
          type: string
          title: Harmonized System Code
          description: >-
            The Harmonized System (HS) code is an internationally standardized
            system of names and numbers to classify traded products. The HS
            code, sometimes called Commodity Code, is used by customs
            authorities around the world to identify products when assessing
            duties and taxes. The HS code may also be referred to as the tariff
            code or customs code. Values should contain only digits and
            decimals.
          maxLength: 25
          pattern: ^\d+(\.\d+)*$
        product_code:
          type: string
          title: Product code
          description: >-
            Optional field to track a product code or SKU for the line item.
            This can be used to later reporting on product purchases.
          maxLength: 50
        quantity:
          type: integer
          title: Quantity
          description: >-
            This number will be multiplied by the unit amount to compute the
            subtotal before any discounts or taxes.
          default: 1
        description:
          type: string
          title: Description
          description: Description that appears on the invoice.
          maxLength: 255
        unit_amount:
          type: number
          format: float
          title: Unit amount
          description: >-
            A positive or negative amount will result in a positive
            `unit_amount`.
    RecoveryTransactionCreate:
      required:
        - gateway_error_code
        - attempted_collection_date
      type: object
      properties:
        gateway_error_code:
          type: string
          title: Gateway error code
          description: >-
            The error code returned by the payment gateway for the original
            payment collection attempt.
          maxLength: 50
        merchant_advice_code:
          type: string
          title: Merchant advice code
          description: >-
            The advice code returned by the payment gateway for the original
            payment collection attempt. This field is only applicable for
            certain gateways.
          maxLength: 2
        attempted_collection_date:
          type: string
          format: date-time
          title: Attempted collection date
          description: The date the original payment collection was attempted.
    AddressWithName:
      allOf:
        - $ref: '#/components/schemas/Address'
      type: object
      properties:
        first_name:
          type: string
          title: First name
        last_name:
          type: string
          title: Last name
    BillingInfo:
